services:
  glance-status:
    image: ghcr.io/sidun-av/glance-status:latest
    restart: unless-stopped
    environment:
      - TITLE=${TITLE:-}
      - GRAFANA_URL=${GRAFANA_URL}
      - GRAFANA_TOKEN=${GRAFANA_TOKEN}
      - SPEEDTEST_URL=${SPEEDTEST_URL}
      - SPEEDTEST_TOKEN=${SPEEDTEST_TOKEN}
      - SERVICES_STATUS_URL=${SERVICES_STATUS_URL}
      - INFRA_CHECK_NPMPLUS_URL=${INFRA_CHECK_NPMPLUS_URL}
      - INFRA_CHECK_HOMEASSISTANT_URL=${INFRA_CHECK_HOMEASSISTANT_URL}
    volumes:
      - ./config.yml:/config.yml:ro
    # Must be on the same Docker network as Glance and glance-services for
    # container-name DNS (e.g. http://glance-status:8080) to resolve — join
    # the same compose project/stack as those, or add an explicit
    # `networks:` block pointing at a shared external network.
